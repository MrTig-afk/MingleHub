name: CI

on:
  # Only main on push. Without the branch filter a PR branch matches BOTH
  # push and pull_request, so every PR ran the whole suite twice and sent
  # two failure emails per push.
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Ephemeral, isolated DB for this run only — no real Neon credentials
      # needed in CI. DATABASE_SSL=disable below matches its plain (no-TLS)
      # local setup; real deployments still default to ssl=require (db.py).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mh
          POSTGRES_PASSWORD: mh
          POSTGRES_DB: minglehub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mh:mh@localhost:5432/minglehub_ci
      DATABASE_SSL: disable
      API_KEY: ci-key
      DEV_MODE: "true"
      SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Lint (flake8)
        run: python -m flake8 api scripts

      - name: Generate dev-only NFC encryption key
        # A fresh throwaway Fernet key per run — never reused, never a real secret.
        run: echo "NFC_KEY_ENCRYPTION_SECRET=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Migrate + seed dev fixtures
        run: |
          python scripts/migrate.py
          python scripts/seed_platform.py

      - name: Run tests
        run: python -m pytest api/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Rulesets are PINNED, never `--config auto`: auto resolves the
      # registry at run time, so a green main can go red with no code
      # change - disqualifying for a required check.
      - run: >
          semgrep scan --error
          --config p/python
          --config p/javascript
          --config p/secrets
