<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale/user-scalable: this app is touch-gameplay-driven
         (multi-finger picker) — native pinch/double-tap zoom getting
         triggered mid-gesture breaks the picker (touch coordinates are
         tracked in unscaled layout pixels, so a zoomed viewport throws
         off the "tap within 70px of the winner" hit-test). touch-action:
         none on the touch zone itself isn't always enough on iOS Safari. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MingleHub" />
    <title>MingleHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
